name: fusha_student_app
description: تطبيق منصة فُصْحَى التعليمية — الأستاذ أشرف سليم

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Networking
  dio: ^5.4.3+1

  # Auth
  supabase_flutter: ^2.5.0
  local_auth: ^2.1.8

  # Secure Storage
  flutter_secure_storage: ^10.0.0

  # Video Player
  video_player: ^2.8.7
  chewie: 1.7.5
  youtube_player_flutter: ^9.1.1

  # PDF Viewer
  syncfusion_flutter_pdfviewer: ^28.2.9

  # Device Info
  device_info_plus: ^11.0.0
  package_info_plus: ^8.0.0



  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.3.3
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.0

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  url_launcher: ^6.2.6
  connectivity_plus: ^6.0.3
  app_links: ^6.4.0

  # Navigation
  go_router: ^14.0.0

  # Push Notifications
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
