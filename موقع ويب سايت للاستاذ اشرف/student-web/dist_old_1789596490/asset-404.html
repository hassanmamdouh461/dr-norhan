<!DOCTYPE html>
<html lang="ar" dir="rtl" translate="no" class="notranslate">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الصفحة غير موجودة | فُصْحَى</title>
  <meta name="robots" content="noindex" />
  <style>
    /* هوية فُصْحَى — الألوان من نظام التصميم (مُضمَّنة لأنها صفحة خطأ مستقلة) */
    :root {
      --teal-800: #163134;
      --teal-500: #37695C;
      --gold-500: #E8B54A;
      --sand-300: #B7B19B;
      --canvas: #F8F9F7;
      --text-muted: #5B6361;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--canvas);
      color: var(--teal-800);
      font-family: 'Cairo', 'Avenir Arabic', 'IBM Plex Sans Arabic', system-ui, sans-serif;
      padding: 24px;
      text-align: center;
    }
    .box {
      max-width: 480px;
      background: #FFFFFF;
      border: 1px solid var(--sand-300);
      border-radius: 20px;
      padding: 48px 32px;
      box-shadow: 0 12px 24px -4px rgba(22, 49, 52, 0.12);
    }
    .code {
      font-size: 64px;
      font-weight: 800;
      line-height: 1;
      color: var(--teal-500);
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    p {
      font-size: 16px;
      line-height: 26px;
      color: var(--text-muted);
      margin-bottom: 32px;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 32px;
      background: var(--teal-800);
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      border-radius: 12px;
      transition: transform 200ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    a:hover { transform: scale(0.98); }
    @media (prefers-reduced-motion: reduce) { a { transition: none; } }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">٤٠٤</div>
    <h1>الصفحة غير موجودة</h1>
    <p>ربما تغيّر الرابط أو لم يعد متاحاً. يمكنك العودة إلى الصفحة الرئيسية والمتابعة من هناك.</p>
    <a href="/">العودة إلى فُصْحَى</a>
  </div>
</body>
</html>
