<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول والاشتراك | منصة فُصْحَى — أ. أشرف سليم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;700;800;900&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-fusha-forestDark text-slate-100 font-cairo antialiased min-h-screen flex flex-col justify-between selection:bg-fusha-khaki selection:text-fusha-forest" style="background-color: #0D1D18 !important; color: #F1F5F9 !important;">

  <!-- Header -->
  <header class="w-full max-w-6xl mx-auto p-4 sm:p-6 flex items-center justify-between z-10">
    <a href="index.html" class="flex items-center gap-3 group">
      <img src="assets/fusha-brand-logo-white.png" alt="فصحى" class="h-10 sm:h-12 w-auto object-contain drop-shadow-md group-hover:scale-105 transition-transform" />
      <span class="text-xs sm:text-sm font-alexandria font-bold text-white/90 hidden sm:inline">أ. أشرف سليم — لغة عربية</span>
    </a>
    <a href="index.html" class="flex items-center gap-2 text-xs sm:text-sm text-fusha-khaki hover:text-white transition">
      <span>العودة للرئيسية</span>
      <i data-lucide="arrow-left" class="w-4 h-4"></i>
    </a>
  </header>

  <!-- Main Container -->
  <main class="w-full max-w-lg mx-auto px-4 py-8 relative z-10">
    <div class="bg-fusha-forest/90 border border-white/10 backdrop-blur-xl rounded-3xl p-6 sm:p-8 shadow-2xl shadow-black/40">
      
      <!-- Logo & Title -->
      <div class="text-center mb-6">
        <h1 class="font-alexandria font-extrabold text-2xl sm:text-3xl text-white">بوابة طلاب فُصْحَى</h1>
        <p class="text-xs sm:text-sm text-fusha-khaki mt-1">رحلة التفوق في اللغة العربية للثانوية العامة</p>
      </div>

      <!-- Tab Switcher -->
      <div class="grid grid-cols-2 p-1 bg-fusha-forestDark/80 rounded-2xl mb-6 border border-white/5">
        <button id="tabLoginBtn" class="py-2.5 rounded-xl font-alexandria font-bold text-sm transition-all bg-fusha-sun text-fusha-forestDark shadow-md">
          تسجيل الدخول
        </button>
        <button id="tabRegisterBtn" class="py-2.5 rounded-xl font-alexandria font-bold text-sm text-white/70 hover:text-white transition-all">
          طالب جديد
        </button>
      </div>

      <!-- Alert Box -->
      <div id="authAlert" class="hidden mb-4 p-3 rounded-xl text-xs font-medium flex items-center gap-2"></div>

      <!-- 1. LOGIN FORM -->
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-fusha-khaki mb-1.5">رقم الهاتف أو البريد الإلكتروني</label>
          <div class="relative">
            <input type="text" id="loginIdentifier" required placeholder="010XXXXXXXX أو your@email.com" class="w-full px-4 py-3 pe-10 rounded-xl bg-white/5 border border-white/10 text-white placeholder:text-stone-500 text-sm focus:outline-none focus:border-fusha-sun transition" />
            <i data-lucide="user" class="w-4 h-4 absolute end-3.5 top-3.5 text-stone-400"></i>
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="text-xs font-semibold text-fusha-khaki">كلمة المرور</label>
            <button type="button" onclick="openResetModal()" class="text-[11px] text-fusha-sun hover:underline">نسيت كلمة المرور؟</button>
          </div>
          <div class="relative">
            <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full px-4 py-3 pe-10 rounded-xl bg-white/5 border border-white/10 text-white placeholder:text-stone-500 text-sm focus:outline-none focus:border-fusha-sun transition" />
            <i data-lucide="lock" class="w-4 h-4 absolute end-3.5 top-3.5 text-stone-400"></i>
          </div>
        </div>

        <button type="submit" id="loginSubmitBtn" class="w-full py-3.5 rounded-xl bg-fusha-sun hover:bg-fusha-sunHover text-fusha-forestDark font-alexandria font-bold text-sm shadow-lg shadow-fusha-sun/20 transition flex items-center justify-center gap-2">
          <span>دخول للمنصة</span>
          <i data-lucide="log-in" class="w-4 h-4"></i>
        </button>
      </form>

      <!-- 2. REGISTER FORM -->
      <form id="registerForm" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-semibold text-fusha-khaki mb-1">الاسم الرباعي للطالب</label>
          <input type="text" id="regFullName" required placeholder="مثال: أحمد محمد علي إبراهيم" class="w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder:text-stone-500 text-sm focus:outline-none focus:border-fusha-sun transition" />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-fusha-khaki mb-1">هاتف الطالب (واتساب)</label>
            <input type="tel" id="regPhone" required placeholder="010XXXXXXXX" class="w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder:text-stone-500 text-sm focus:outline-none focus:border-fusha-sun transition" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-fusha-khaki mb-1">هاتف ولي الأمر</label>
            <input type="tel" id="regParentPhone" placeholder="01XXXXXXXXX" class="w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder:text-stone-500 text-sm focus:outline-none focus:border-fusha-sun transition" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-fusha-khaki mb-1">البريد الإلكتروني</label>
          <input type="email" id="regEmail" required placeholder="student@example.com" class="w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder:text-stone-500 text-sm focus:outline-none focus:border-fusha-sun transition" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-fusha-khaki mb-1">كلمة المرور (8 أحرف على الأقل)</label>
          <input type="password" id="regPassword" minlength="8" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder:text-stone-500 text-sm focus:outline-none focus:border-fusha-sun transition" />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-fusha-khaki mb-1">الصف الدراسي</label>
            <select id="regGrade" required class="w-full px-4 py-2.5 rounded-xl bg-fusha-forestDark border border-white/10 text-white text-sm focus:outline-none focus:border-fusha-sun transition">
              <option value="الصف الثالث الثانوي">الصف الثالث الثانوي</option>
              <option value="الصف الثاني الثانوي">الصف الثاني الثانوي</option>
              <option value="الصف الأول الثانوي">الصف الأول الثانوي</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-fusha-khaki mb-1">الشعبة</label>
            <select id="regBranch" class="w-full px-4 py-2.5 rounded-xl bg-fusha-forestDark border border-white/10 text-white text-sm focus:outline-none focus:border-fusha-sun transition">
              <option value="عام">عام</option>
              <option value="علمي علوم">علمي علوم</option>
              <option value="علمي رياضة">علمي رياضة</option>
              <option value="أدبي">أدبي</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-fusha-khaki mb-1">كود الإحالة / كود الزميل (اختياري)</label>
          <input type="text" id="regReferral" placeholder="FUSHA-XXXX" class="w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder:text-stone-500 text-sm focus:outline-none focus:border-fusha-sun uppercase transition" />
        </div>

        <button type="submit" id="registerSubmitBtn" class="w-full py-3.5 rounded-xl bg-fusha-sun hover:bg-fusha-sunHover text-fusha-forestDark font-alexandria font-bold text-sm shadow-lg shadow-fusha-sun/20 transition flex items-center justify-center gap-2 mt-2">
          <span>إنشاء حساب والبدء فوراً</span>
          <i data-lucide="check-circle" class="w-4 h-4"></i>
        </button>
      </form>

    </div>
  </main>

  <!-- Reset Password Modal -->
  <div id="resetModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm hidden">
    <div class="bg-fusha-forest border border-white/15 rounded-3xl p-6 max-w-md w-full relative shadow-2xl">
      <button onclick="closeResetModal()" class="absolute top-4 start-4 text-stone-400 hover:text-white">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
      <div class="text-center mb-5">
        <div class="w-12 h-12 rounded-2xl bg-fusha-sun/10 text-fusha-sun flex items-center justify-center mx-auto mb-2 border border-fusha-sun/20">
          <i data-lucide="key" class="w-6 h-6"></i>
        </div>
        <h3 class="font-alexandria font-bold text-lg text-white">استعادة كلمة المرور</h3>
        <p class="text-xs text-stone-300 mt-1">أدخل هاتفك أو بريدك المسجل لإرسال رابط أو كود الاستعادة</p>
      </div>
      <form id="resetForm" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-fusha-khaki mb-1">رقم الهاتف أو البريد</label>
          <input type="text" id="resetIdentifier" required class="w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white text-sm focus:outline-none focus:border-fusha-sun" placeholder="010XXXXXXXX" />
        </div>
        <button type="submit" class="w-full py-3 rounded-xl bg-fusha-sun text-fusha-forestDark font-bold text-xs hover:bg-fusha-sunHover transition">
          إرسال طلب الاستعادة
        </button>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer class="w-full text-center py-4 text-stone-400 text-xs z-10 border-t border-white/5">
    جميع الحقوق محفوظة © لمنصة فُصْحَى — الأستاذ أشرف سليم <span id="year"></span>
  </footer>

  <script src="/assets/js/api.js?v=20260917_02"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    if (window.lucide) window.lucide.createIcons();

    // Check if already logged in
    if (window.api && window.api.isLoggedIn()) {
      window.location.href = 'dashboard.html';
    }

    // URL parameter check for tab
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('tab') === 'register') {
      switchTab('register');
    }

    const tabLoginBtn = document.getElementById('tabLoginBtn');
    const tabRegisterBtn = document.getElementById('tabRegisterBtn');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const authAlert = document.getElementById('authAlert');

    tabLoginBtn.addEventListener('click', () => switchTab('login'));
    tabRegisterBtn.addEventListener('click', () => switchTab('register'));

    function switchTab(tab) {
      if (tab === 'login') {
        tabLoginBtn.className = 'py-2.5 rounded-xl font-alexandria font-bold text-sm transition-all bg-fusha-sun text-fusha-forestDark shadow-md';
        tabRegisterBtn.className = 'py-2.5 rounded-xl font-alexandria font-bold text-sm text-white/70 hover:text-white transition-all';
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
      } else {
        tabRegisterBtn.className = 'py-2.5 rounded-xl font-alexandria font-bold text-sm transition-all bg-fusha-sun text-fusha-forestDark shadow-md';
        tabLoginBtn.className = 'py-2.5 rounded-xl font-alexandria font-bold text-sm text-white/70 hover:text-white transition-all';
        registerForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
      }
      authAlert.classList.add('hidden');
    }

    function showAlert(msg, isError = true) {
      authAlert.textContent = msg;
      authAlert.className = `mb-4 p-3 rounded-xl text-xs font-medium flex items-center gap-2 ${
        isError ? 'bg-red-500/20 text-red-300 border border-red-500/30' : 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'
      }`;
      authAlert.classList.remove('hidden');
    }

    // Handle Login Submit
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const identifier = document.getElementById('loginIdentifier').value.trim();
      const password = document.getElementById('loginPassword').value;
      const submitBtn = document.getElementById('loginSubmitBtn');

      const isEmail = identifier.includes('@');
      const credentials = isEmail ? { email: identifier, password } : { phone: identifier, password };

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span>جاري الدخول...</span> <i data-lucide="loader" class="w-4 h-4 animate-spin"></i>`;
      if (window.lucide) window.lucide.createIcons();

      try {
        await window.api.auth.login(credentials);
        window.showToast('تم تسجيل الدخول بنجاح! مرحباً بك.', 'success');
        setTimeout(() => {
          const redirect = urlParams.get('redirect') || 'dashboard.html';
          window.location.href = redirect;
        }, 600);
      } catch (err) {
        showAlert(err.message || 'فشل تسجيل الدخول. تأكد من صحة البيانات.');
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>دخول للمنصة</span> <i data-lucide="log-in" class="w-4 h-4"></i>`;
        if (window.lucide) window.lucide.createIcons();
      }
    });

    // Handle Register Submit
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('registerSubmitBtn');
      const payload = {
        full_name: document.getElementById('regFullName').value.trim(),
        phone: document.getElementById('regPhone').value.trim(),
        parent_phone: document.getElementById('regParentPhone').value.trim() || undefined,
        email: document.getElementById('regEmail').value.trim(),
        password: document.getElementById('regPassword').value,
        grade: document.getElementById('regGrade').value,
        branch: document.getElementById('regBranch').value,
        referral_code: document.getElementById('regReferral').value.trim() || undefined,
      };

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span>جاري إنشاء الحساب...</span> <i data-lucide="loader" class="w-4 h-4 animate-spin"></i>`;
      if (window.lucide) window.lucide.createIcons();

      try {
        await window.api.auth.register(payload);
        window.showToast('تم إنشاء الحساب بنجاح! أهلاً بك في منصة فُصْحَى.', 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 700);
      } catch (err) {
        showAlert(err.message || 'تعذر إنشاء الحساب. تأكد من أن الهاتف أو البريد غير مستخدم مسبقاً.');
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>إنشاء حساب والبدء فوراً</span> <i data-lucide="check-circle" class="w-4 h-4"></i>`;
        if (window.lucide) window.lucide.createIcons();
      }
    });

    // Modal helpers
    function openResetModal() {
      document.getElementById('resetModal').classList.remove('hidden');
    }
    function closeResetModal() {
      document.getElementById('resetModal').classList.add('hidden');
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('resetIdentifier').value.trim();
      try {
        await window.api.auth.resetPassword({ identifier: id });
        window.showToast('تم إرسال تعليمات الاستعادة بنجاح.', 'success');
        closeResetModal();
      } catch (err) {
        window.showToast(err.message || 'تعذر إرسال طلب الاستعادة حالياً.', 'error');
      }
    });
  </script>
</body>
</html>
